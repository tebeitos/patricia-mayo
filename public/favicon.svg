<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;display=swap');
      .favicon-bg {
        fill: #0D0D0D;
        stroke: #C4572A;
        stroke-width: 12;
      }
      .favicon-text {
        font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 250px;
        fill: #F2EFE8;
        letter-spacing: -4px;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .favicon-dot {
        fill: #C4572A;
      }
    </style>
  </defs>

  <!-- Fondo Circular Negro con borde Terracota -->
  <circle cx="256" cy="256" r="236" class="favicon-bg" />

  <!-- Monograma PM en Tipografía Serif Crema -->
  <text x="256" y="258" class="favicon-text">PM</text>

  <!-- Punto de Acento Terracota -->
  <circle cx="395" cy="355" r="16" class="favicon-dot" />
</svg>
